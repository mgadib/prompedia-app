<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <!-- Primary Meta Tags (fallback; app sets via SEO component) -->
  <title>prompedia.app - Catatan prompt AI</title>
  <meta name="title" content="prompedia.app - Catatan prompt AI" />
  <meta name="description" content="Catatan prompt AI. Pribadi secara default. Dibuat untuk komunitas." />
  <meta name="theme-color" content="#fafafa" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://prompedia.app/" />
  <meta property="og:title" content="prompedia.app - Catatan prompt AI" />
  <meta property="og:description" content="Catatan prompt AI. Pribadi secara default. Dibuat untuk komunitas." />
  <meta property="og:site_name" content="prompedia.app" />
  <meta property="og:image" content="https://prompedia.app/logo.png" />
  <meta property="og:locale" content="id_ID" />
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://prompedia.app/" />
  <meta property="twitter:title" content="prompedia.app - Catatan prompt AI" />
  <meta property="twitter:description" content="Catatan prompt AI. Pribadi secara default. Dibuat untuk komunitas." />
  <meta property="twitter:image" content="https://prompedia.app/logo.png" />
  
  <!-- Canonical -->
  <link rel="canonical" href="https://prompedia.app/" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />

  <style>
    /* Prevent FOUC */
    body {
      visibility: hidden;
    }

    body.loaded {
      visibility: visible;
    }
  </style>

  <script>
    (function () {
      try {
        const theme = localStorage.getItem('vite-ui-theme') || 'light';
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>document.body.classList.add('loaded');</script>
</body>

</html>
