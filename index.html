<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <!-- Primary Meta Tags -->
  <title>Prompedia - Personal Prompt Notes</title>
  <meta name="title" content="Prompedia - Personal Prompt Notes" />
  <meta name="description" content="Prompedia - Personal Prompt Notes" />
  <meta name="theme-color" content="#fafafa" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />

  <style>
    /* Prevent FOUC */
    body {
      visibility: hidden;
    }

    body.loaded {
      visibility: visible;
    }
  </style>

  <script>
    (function () {
      try {
        const theme = localStorage.getItem('vite-ui-theme') || 'light';
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>

  <!-- Umami Analytics -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="4bd428fc-f43c-442b-8a5c-c51903467c53"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>document.body.classList.add('loaded');</script>
</body>

</html>
